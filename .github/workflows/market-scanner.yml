name: 24/7 Autonomous Market Scanner
run-name: 🌐 24/7 Autonomous Market Scan

on:
  schedule:
    # 1) Every 4 hours at :05 UTC (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC)
    #    Monitors 4H and 1D crypto candle closes and general market momentum
    - cron: '5 */4 * * *'
    # 2) Daily at 06:00 UTC (09:00 Bulgarian time / EEST)
    #    Dispatches Daily Morning Digest and checks morning market setups
    - cron: '0 6 * * *'
    # 3) Mon-Fri: Active trading session scan every 2 hours (08:00 to 20:00 UTC) + market close at 21:05 UTC
    #    Scans traditional assets (US stocks, crypto stocks, international stocks, commodities, indices)
    - cron: '5 8,10,12,14,16,18,20,21 * * 1-5'
    # 4) Weekly on Saturday at 08:00 UTC
    #    Refreshes corporate fundamentals (DCF/Forensics) and optimal backtest DNA profiles
    - cron: '0 8 * * 6'

  workflow_dispatch:
    inputs:
      asset_class:
        description: 'Asset class to scan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crypto
          - us_stocks
          - ai_stocks
          - crypto_stocks
          - commodities
          - indices
      refresh_fundamentals:
        description: 'Refresh corporate fundamentals (DCF/Forensics)'
        required: false
        default: false
        type: boolean
      send_digest:
        description: 'Send Daily Digest to Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-alert:
    name: 🔍 Scan Markets & Dispatch Telegram Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TELEGRAM_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Refresh Corporate Fundamentals (Daily Filing-Aware Check)
        run: |
          REFRESH_FUND="${{ github.event.inputs.refresh_fundamentals }}"
          DAY_OF_WEEK=$(date -u +%u)
          CURRENT_HOUR=$(date -u +%H)
          if [ "$REFRESH_FUND" = "true" ]; then
            echo "Executing forced fundamental refresh across corporate equities..."
            python src/main.py --refresh-fundamentals --force --limit 100 --no-export --no-git-sync || echo "Warning: forced fundamental refresh had issues, continuing..."
          elif [ "$DAY_OF_WEEK" = "6" ]; then
            echo "Executing weekly full rotation fundamental refresh..."
            python src/main.py --refresh-fundamentals --limit 90 --no-export --no-git-sync || echo "Warning: weekly fundamental refresh had issues, continuing..."
          elif [ "$CURRENT_HOUR" = "06" ] || [ "$CURRENT_HOUR" = "07" ] || [ "$CURRENT_HOUR" = "21" ] || [ "$CURRENT_HOUR" = "22" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Executing daily filing-aware & oldest-checked fundamental check..."
            python src/main.py --refresh-fundamentals --limit 60 --no-export --no-git-sync || echo "Warning: daily fundamental check had issues, continuing..."
          else
            echo "Running fast priority fundamental check..."
            python src/main.py --refresh-fundamentals --limit 25 --no-export --no-git-sync || echo "Warning: lightweight fundamental check had issues, continuing..."
          fi

      - name: 🚀 Run Market Scanner (1D)
        run: |
          ASSET_CLASS="${{ github.event.inputs.asset_class }}"
          if [ -z "$ASSET_CLASS" ] || [ "$ASSET_CLASS" = "true" ]; then
            ASSET_CLASS="all"
          fi
          echo "Executing market scan for asset class: $ASSET_CLASS (1D)"
          python src/main.py --scan --asset-class "$ASSET_CLASS" --timeframe 1D --limit 50 --no-export --no-git-sync || echo "Notice: 1D scan completed with warnings, proceeding..."

      - name: ⚡ Run Crypto 4H Scanner
        run: |
          ASSET_CLASS="${{ github.event.inputs.asset_class }}"
          if [ -z "$ASSET_CLASS" ] || [ "$ASSET_CLASS" = "all" ] || [ "$ASSET_CLASS" = "crypto" ]; then
            echo "Executing Crypto 4H scan..."
            python src/main.py --scan --asset-class crypto --timeframe 4H --limit 50 --no-export --no-git-sync || echo "Notice: 4H crypto scan completed with warnings, proceeding..."
          else
            echo "Skipping 4H crypto scan for targeted asset class: $ASSET_CLASS"
          fi

      - name: 📊 Export Dashboard JSON & Dossiers
        run: |
          python src/main.py --export-dashboard --no-git-sync

      - name: 📰 Dispatch Daily Digest (if scheduled or requested)
        run: |
          CURRENT_HOUR=$(date -u +%H)
          SEND_DIGEST="${{ github.event.inputs.send_digest }}"
          if [ "$SEND_DIGEST" = "true" ] || [ "$CURRENT_HOUR" = "06" ] || [ "$CURRENT_HOUR" = "07" ]; then
            echo "Dispatching daily market digest to Telegram (UTC hour: $CURRENT_HOUR)..."
            python src/main.py --digest || echo "Digest already sent today or skipped."
          else
            echo "Outside morning digest window (UTC hour: $CURRENT_HOUR). Skipping daily digest."
          fi

      - name: 💾 Commit & Push Updated Dashboard & State Data
        run: |
          git add dashboard/ data/asset_optimal_profiles.json data/rotation_state.json research/verdicts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update market scanner data"
            git pull --no-rebase -X ours origin master || true
            git push origin master || echo "Push warning: unable to push, verify repository Settings -> Actions -> General -> Workflow permissions have Read and write permissions."
            echo "✅ Dashboard and state data successfully pushed to GitHub Pages!"
          else
            echo "ℹ️ No market state changes to commit."
          fi

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Upload Dashboard Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard'

      - name: 🚀 Deploy Direct to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

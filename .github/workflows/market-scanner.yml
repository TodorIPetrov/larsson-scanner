name: 24/7 Autonomous Market Scanner

on:
  schedule:
    # Every 4 hours at :05 (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC)
    - cron: '5 */4 * * *'
    # Mon-Fri at 21:05 UTC (shortly after US stock market close)
    - cron: '5 21 * * 1-5'
    # Daily at 08:00 UTC (11:00 Bulgarian time for Daily Morning Digest)
    - cron: '0 8 * * *'

  workflow_dispatch:
    inputs:
      asset_class:
        description: 'Asset class to scan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crypto
          - us_stocks
          - ai_stocks
          - crypto_stocks
          - commodities
          - indices
      send_digest:
        description: 'Send Daily Digest to Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scan-and-alert:
    name: 🔍 Scan Markets & Dispatch Telegram Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Run Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ASSET_CLASS="${{ github.event.inputs.asset_class || 'all' }}"
          echo "Executing market scan for asset class: $ASSET_CLASS"
          python src/main.py --scan --asset-class "$ASSET_CLASS" --timeframe 1D --limit 50

      - name: 📰 Dispatch Daily Digest (if scheduled or requested)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          if [ "${{ github.event.inputs.send_digest }}" = "true" ] || [ "$CURRENT_HOUR" = "08" ]; then
            echo "Dispatching daily market digest to Telegram..."
            python src/main.py --digest || echo "Digest already sent or skipped."
          fi

      - name: 💾 Commit & Push Updated Dashboard Data
        run: |
          git add dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update market scanner data [skip ci]"
            git pull --rebase -X ours origin master || true
            git push origin master
            echo "✅ Dashboard data successfully pushed to GitHub Pages!"
          else
            echo "ℹ️ No market state changes to commit."
          fi

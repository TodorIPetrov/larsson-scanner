name: 24/7 Autonomous Market Scanner
run-name: 🌐 24/7 Autonomous Market Scan

on:
  schedule:
    # 1) Every 4 hours at :05 UTC (00:05, 04:05, 08:05, 12:05, 16:05, 20:05 UTC)
    #    Monitors 4H and 1D crypto candle closes and general market momentum
    - cron: '5 */4 * * *'
    # 2) Daily at 08:00 UTC (11:00 Bulgarian time / EEST)
    #    Dispatches Daily Morning Digest and checks morning market setups
    - cron: '0 8 * * *'
    # 3) Monday to Friday at 21:05 UTC (shortly after US stock market close at 21:00 UTC)
    #    Scans traditional assets (US stocks, crypto stocks, international stocks, commodities, indices)
    - cron: '5 21 * * 1-5'

  workflow_dispatch:
    inputs:
      asset_class:
        description: 'Asset class to scan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crypto
          - us_stocks
          - ai_stocks
          - crypto_stocks
          - commodities
          - indices
      send_digest:
        description: 'Send Daily Digest to Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scan-and-alert:
    name: 🔍 Scan Markets & Dispatch Telegram Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Run Market Scanner (1D)
        run: |
          ASSET_CLASS="${{ github.event.inputs.asset_class }}"
          if [ -z "$ASSET_CLASS" ] || [ "$ASSET_CLASS" = "true" ]; then
            ASSET_CLASS="all"
          fi
          echo "Executing market scan for asset class: $ASSET_CLASS (1D)"
          python src/main.py --scan --asset-class "$ASSET_CLASS" --timeframe 1D --limit 50

      - name: ⚡ Run Crypto 4H Scanner
        run: |
          ASSET_CLASS="${{ github.event.inputs.asset_class }}"
          if [ -z "$ASSET_CLASS" ] || [ "$ASSET_CLASS" = "all" ] || [ "$ASSET_CLASS" = "crypto" ]; then
            echo "Executing Crypto 4H scan..."
            python src/main.py --scan --asset-class crypto --timeframe 4H --limit 50
          else
            echo "Skipping 4H crypto scan for targeted asset class: $ASSET_CLASS"
          fi

      - name: 📊 Export Dashboard JSON
        run: |
          python src/main.py --export-dashboard

      - name: 📰 Dispatch Daily Digest (if scheduled or requested)
        run: |
          CURRENT_HOUR=$(date -u +%H)
          SEND_DIGEST="${{ github.event.inputs.send_digest }}"
          if [ "$SEND_DIGEST" = "true" ] || [ "$CURRENT_HOUR" = "07" ] || [ "$CURRENT_HOUR" = "08" ] || [ "$CURRENT_HOUR" = "09" ]; then
            echo "Dispatching daily market digest to Telegram (UTC hour: $CURRENT_HOUR)..."
            python src/main.py --digest || echo "Digest already sent today or skipped."
          else
            echo "Outside morning digest window (UTC hour: $CURRENT_HOUR). Skipping daily digest."
          fi

      - name: 💾 Commit & Push Updated Dashboard Data
        run: |
          git add dashboard/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update market scanner data [skip ci]"
            git pull --no-rebase -X ours origin master || true
            git push origin master || echo "Push warning: unable to push, verify repository Settings -> Actions -> General -> Workflow permissions have Read and write permissions."
            echo "✅ Dashboard data successfully pushed to GitHub Pages!"
          else
            echo "ℹ️ No market state changes to commit."
          fi

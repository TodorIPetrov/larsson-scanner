services:
  scanner:
    build: .
    container_name: larsson_market_scanner
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

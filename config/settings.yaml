telegram:
  bot_token: ""  # Set here or in config/settings.local.yaml
  chat_id: ""    # Set here or in config/settings.local.yaml
  batch_threshold: 5
  include_sr_in_alerts: false # Set to true when confident in S/R levels to enable in Telegram alerts

scanner:
  crypto_top_n: 100       # Automatically scan top N USDT pairs by 24h volume
  min_warmup_candles: 160 # Candles to fetch for SMMA stabilization
  rate_limit_delay_s: 0.05

storage:
  db_path: "state.db"

trading:
  enabled: true
  mode: "paper" # paper / testnet / live
  initial_balance_usd: 10000.0
  default_position_size_usd: 100.0
  max_active_positions: 5
  proposal_ttl_minutes: 15
  fee_pct: 0.1 # 0.1% standard Binance Spot taker/maker fee
  btc_safety_filter: true
  min_confluence_score: 60
  allowed_tiers: ["A+", "A", "B"]

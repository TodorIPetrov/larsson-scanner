telegram:
  enabled: false # Paused per user request until further notice
  bot_token: ""  # Set here or in config/settings.local.yaml
  chat_id: ""    # Set here or in config/settings.local.yaml
  batch_threshold: 5
  include_sr_in_alerts: false # Set to true when confident in S/R levels to enable in Telegram alerts
  alert_filters:
    only_gold_transitions: true  # Only dispatch alerts when assets transition to GOLD
    priority_assets:             # For these assets, dispatch ALL transitions (GOLD, BLUE, NEUTRAL)
      - "BTCUSDT"
      - "BTC"
      - "MSTR"
      - "3350.T"
      - "NAKA"
  morning_digest:
    hour: 9
    minute: 0
    timezone: "Europe/Sofia"

scanner:
  crypto_top_n: 100       # Automatically scan top N USDT pairs by 24h volume
  min_warmup_candles: 160 # Candles to fetch for SMMA stabilization
  rate_limit_delay_s: 0.05

storage:
  db_path: "state.db"

trading:
  enabled: true
  mode: "paper" # paper / testnet / live
  initial_balance_usd: 10000.0
  default_position_size_usd: 100.0
  max_active_positions: 5
  proposal_ttl_minutes: 15
  fee_pct: 0.1 # 0.1% standard Binance Spot taker/maker fee
  btc_safety_filter: true
  min_confluence_score: 60
  allowed_tiers: ["A+", "A", "B"]
  partial_take_profit: true
  trailing_stop_atr_mult: 2.5
  volatility_sizing_enabled: true
  slippage_model_enabled: true
  risk_per_trade_pct: 0.015
  max_crypto_positions: 3
  slippage_pct_crypto: 0.0010
  slippage_pct_equities: 0.0005

x_monitor:
  enabled: true
  account: "NoLimitGains"
  daily_scan_hour: 18
  daily_scan_minute: 0

onchain:
  enabled: true
  source: "csv"                 # "csv" (reads data/blockhorizon/*.csv), "api", or "fallback"
  data_dir: "data/blockhorizon"
  api_key: ""                   # BlockHorizon API key if subscription includes API
  base_url: "https://blockhorizon.io/api"
  apply_to_confluence: true     # Apply cycle tailwind/headwind points to BTC trades
  apply_to_sizing: true         # Scale position size by regime (0.3x to 1.25x)
  apply_to_alts: true           # Gate altcoin longs when BTC is in Euphoria

